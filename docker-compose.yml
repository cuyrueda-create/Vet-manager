services:
  # ==================== BASE DE DATOS ====================
  mysql:
    image: mysql:8.0
    container_name: vet_manager_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definida en .env (ver .env.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vet_manager}
      MYSQL_USER: ${MYSQL_APP_USER:-vet_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definida en .env (ver .env.example)}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/2-roles.sh:/docker-entrypoint-initdb.d/2-roles.sh
    networks:
      - vet_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      timeout: 20s
      retries: 10
      interval: 10s

  # ==================== BACKEND ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vet_manager_backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: ${MYSQL_APP_USER:-vet_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Definida en .env (ver .env.example)}
      DB_OWNER_USER: ${MYSQL_OWNER_USER:-vet_owner}
      DB_OWNER_PASSWORD: ${MYSQL_OWNER_PASSWORD:-${MYSQL_PASSWORD}}
      DB_NAME: ${MYSQL_DATABASE:-vet_manager}
      DB_PORT: 3306
      SECRET_KEY: ${SECRET_KEY:?Definida en .env (ver .env.example)}
      ADMIN_CREATE_KEY: ${ADMIN_CREATE_KEY:?Definida en .env (ver .env.example)}
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - vet_network

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    container_name: vet_manager_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - vet_network

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - vet_network

# ==================== VOLÚMENES ====================
volumes:
  mysql_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ==================== REDES ====================
networks:
  vet_network:
    driver: bridge