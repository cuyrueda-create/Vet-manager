sonar.projectKey=cuyrueda-create_Vet-manager
sonar.organization=cuyrueda-create
sonar.sources=.
# Los tests se marcan como código de prueba: así NO entran en el
# denominador de cobertura del Quality Gate (new_coverage >= 80).
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8
sonar.branch.longLivedBranches.regex=(main|master|develop)
# Cobertura de Python: la genera pytest-cov (backend/pytest.ini + requirements-dev.txt)
sonar.python.coverage.reportPaths=backend/coverage.xml
# sonar.exclusions aplica a MAIN files: al excluir backend/tests/** aquí y
# declararlo en sonar.tests, los conjuntos quedan disjoint (evita el error
# "can't be indexed twice" del scanner).
sonar.exclusions=**/node_modules/**,**/frontend/dist/**,**/backups/**,**/*.sql.gz,backend/tests/**
