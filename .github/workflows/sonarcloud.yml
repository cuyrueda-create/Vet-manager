name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        # --only-binary :all: impide ejecutar scripts de instalación (S8541)
        # y las versiones vienen fijadas en requirements-dev.txt (S8544).
        run: "pip install --only-binary :all: -r backend/requirements-dev.txt"
      - name: Ejecutar pruebas con cobertura
        # Se corre desde la RAÍZ del repo (no desde backend/) para que
        # coverage.xml use rutas relativas al repo (backend/app/...), que es
        # lo que SonarCloud espera en sonar.python.coverage.reportPaths.
        run: |
          PYTHONPATH=backend python -m pytest backend/tests --cov=app --cov-report=xml:backend/coverage.xml --cov-report=term
      - name: Subir cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: backend/coverage.xml

  sonarcloud:
    name: SonarCloud Scan
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: "pip install --only-binary :all: -r backend/requirements-dev.txt"
      - name: Generar cobertura para SonarCloud
        run: |
          PYTHONPATH=backend python -m pytest backend/tests --cov=app --cov-report=xml:backend/coverage.xml --cov-report=term
      # Acción fijada por SHA completo por seguridad (regla SonarCloud S7637)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
