name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt
      - name: Ejecutar pruebas con cobertura
        working-directory: backend
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term
      - name: Subir cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: backend/coverage.xml

  sonarcloud:
    name: SonarCloud Scan
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt
      - name: Generar cobertura para SonarCloud
        working-directory: backend
        run: |
          python -m pytest --cov=app --cov-report=xml --cov-report=term
      # Acción fijada por SHA por seguridad (recomendación de SonarCloud)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
