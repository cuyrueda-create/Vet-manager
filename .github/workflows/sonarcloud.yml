name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        # S8544 ("dependencies locked to verified versions") exige ver las
        # versiones == en el propio comando; -r no la satisface. Mantener
        # sincronizado con backend/requirements-dev.txt / requirements.txt.
        run: |
          pip install --only-binary :all: \
            fastapi==0.164.0 'uvicorn[standard]==0.54.0' mysql-connector-python==26.10.0 \
            SQLAlchemy==2.0.57 alembic==1.20.1 'passlib[bcrypt]==1.7.4' \
            'python-jose[cryptography]==3.5.0' python-dotenv==1.2.4 email-validator==2.4.0 \
            pydantic==2.14.3 bcrypt==5.0.0 pyjwt==2.15.1 fpdf2==2.9.0 \
            pytest==9.2.0 pytest-cov==7.1.0 httpx2==2.16.2
      - name: Ejecutar pruebas con cobertura
        # Se corre desde la RAÍZ del repo (no desde backend/) para que
        # coverage.xml use rutas relativas al repo (backend/app/...), que es
        # lo que SonarCloud espera en sonar.python.coverage.reportPaths.
        run: |
          PYTHONPATH=backend python -m pytest backend/tests --cov=app --cov-report=xml:backend/coverage.xml --cov-report=term
      - name: Subir cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: backend/coverage.xml

  sonarcloud:
    name: SonarCloud Scan
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        # S8544: versiones == visibles en el comando (ver comentario del job tests).
        run: |
          pip install --only-binary :all: \
            fastapi==0.164.0 'uvicorn[standard]==0.54.0' mysql-connector-python==26.10.0 \
            SQLAlchemy==2.0.57 alembic==1.20.1 'passlib[bcrypt]==1.7.4' \
            'python-jose[cryptography]==3.5.0' python-dotenv==1.2.4 email-validator==2.4.0 \
            pydantic==2.14.3 bcrypt==5.0.0 pyjwt==2.15.1 fpdf2==2.9.0 \
            pytest==9.2.0 pytest-cov==7.1.0 httpx2==2.16.2
      - name: Generar cobertura para SonarCloud
        run: |
          PYTHONPATH=backend python -m pytest backend/tests --cov=app --cov-report=xml:backend/coverage.xml --cov-report=term
      # Acción fijada por SHA completo por seguridad (regla SonarCloud S7637)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
