# Dependabot (Semana 8, §9 del plan): avisos semanales de actualizaciones
# seguras para dependencias Python, npm, imágenes Docker y acciones de GitHub.
# La política de plazos está en docs/plan-implantacion.md §9.1:
# parche de seguridad -> PR de Dependabot -> CI en verde -> fusionar.
version: 2
updates:
  # --- Python (backend) ---
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependabot"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # --- npm/pnpm (frontend) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependabot"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"

  # --- Imágenes Docker (backend) ---
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependabot"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  # --- Acciones de GitHub (.github/workflows) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependabot"
      - "ci"
    commit-message:
      prefix: "chore(actions)"
