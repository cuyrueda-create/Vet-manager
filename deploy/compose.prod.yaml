# Compose de PRODUCCIÓN — Semana 4 (despliegue en servidor Linux)
# ------------------------------------------------------------------
# Uso (desde la raíz del release desplegado):
#   cp deploy/env.prod.example .env   # y completar los secretos
#   docker compose --project-directory . -f deploy/compose.prod.yaml up -d --wait
#
# Variables (en .env o en el shell):
#   APP_VERSION   versión de las imágenes a ejecutar (obligatoria)
#   HTTP_PORT     puerto publicado de Caddy (defecto 80)
#   HTTPS_PORT    puerto publicado de Caddy (defecto 443)
#   API_PORT      puerto loopback del backend (defecto 5000)
#   KUMA_PORT     puerto loopback de Uptime Kuma (defecto 8081)
#   CADDYFILE     ruta del Caddyfile a montar (defecto deploy/Caddyfile;
#                 usar deploy/Caddyfile.local en pruebas sin dominio)
#
# Diferencias frente a docker-compose.yml (desarrollo):
#   - Usa imágenes con etiqueta de versión (no `build:`): el servidor nunca
#     compila, solo ejecuta. Ver §5.3 del plan de implantación.
#   - Sin volumen de código en vivo ni `--reload`: el código está dentro de la
#     imagen.
#   - MySQL no publica puerto en el host (solo red interna).
#   - El backend solo se publica en loopback; el único acceso público es
#     Caddy (80/443).
#   - Healthchecks para que `--wait` sepa cuándo el stack está listo.
#   - Rotación de logs (json-file, 10m × 3) en todos los servicios (§6.5).

name: vet-manager-prod

# Rotación de logs compartida por todos los servicios (evita llenar el disco
# con logs ilimitados de json-file). Ver §6.2 del plan.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==================== BASE DE DATOS ====================
  mysql:
    image: mysql:8.0
    restart: always
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definida en .env (ver deploy/env.prod.example)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vet_manager}
      MYSQL_USER: ${MYSQL_USER:-vet_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definida en .env (ver deploy/env.prod.example)}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Sin publicación de puertos: MySQL solo es alcanzable desde la red interna
    # del Compose. El respaldo entra por `docker compose exec`.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    networks:
      - vet_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 40s

  # ==================== BACKEND ====================
  backend:
    image: vet-manager-backend:${APP_VERSION:?Define APP_VERSION en .env o en el shell}
    restart: always
    logging: *logging
    environment:
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV:-produccion}
      DB_HOST: mysql
      DB_USER: ${MYSQL_USER:-vet_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Definida en .env (ver deploy/env.prod.example)}
      DB_NAME: ${MYSQL_DATABASE:-vet_manager}
      DB_PORT: 3306
      SECRET_KEY: ${SECRET_KEY:?Definida en .env (ver deploy/env.prod.example)}
      ADMIN_CREATE_KEY: ${ADMIN_CREATE_KEY:?Definida en .env (ver deploy/env.prod.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    # Solo loopback: el acceso externo pasa por Caddy.
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vet_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==================== FRONTEND ====================
  frontend:
    image: vet-manager-frontend:${APP_VERSION:?Define APP_VERSION en .env o en el shell}
    restart: always
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vet_network

  # ==================== REVERSE PROXY ====================
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./${CADDYFILE:-deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - vet_network

  # ==================== MONITOREO (§8.5) ====================
  # Uptime Kuma: monitorea http://backend:5000/health cada 60 s y el latido
  # del respaldo. La UI queda SOLO en loopback (127.0.0.1:8081); para entrar
  # desde el navegador del servidor: ssh -L 8081:127.0.0.1:8081 <usuario>@<servidor>
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: always
    logging: *logging
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:${KUMA_PORT:-8081}:3001"
    networks:
      - vet_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ==================== VOLÚMENES ====================
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:

# ==================== REDES ====================
networks:
  vet_network:
    driver: bridge
