# Render — Blueprint para desplegar Vet Manager (plan §5.3)
# ------------------------------------------------------------------
# Crea dos servicios desde este repo:
#   1. vet-manager-api → Web Service (Docker, backend FastAPI)
#   2. vet-manager-web → Static Site (SPA React)
# La base de datos NO se crea aquí: es Aiven for MySQL Free y sus credenciales
# se rellenan una sola vez en el panel de Render (synced:false).
#
# Referencias usadas (documentación oficial Render, 2026-11-21):
#   - fromService.property: host  → devuelve el hostname onrender.com sin esquema.
#     El backend (config.py) y el frontend (axiosConfig.js) lo normalizan a https.
#   - generateValue: true         → Render genera SECRET_KEY y ADMIN_CREATE_KEY.
#   - routes (rewrite /* → /index.html) → necesario para enlaces tipo
#     /reset-password?token=... y el router de React.
# Validar con: render blueprints validate deploy/render.yaml

services:
  # ==================== BACKEND (API FastAPI) ====================
  - type: web
    name: vet-manager-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: APP_VERSION
        value: 1.0.0
      - key: APP_ENV
        value: nube

      # --- Únicos secretos que el usuario rellena en el panel (Aiven) ---
      - key: DB_HOST        # p. ej. avn-xxxx.aivencloud.com
        sync: false
      - key: DB_PORT        # puerto SSL de Aiven (ver panel)
        sync: false
      - key: DB_NAME        # nombre exacto de la BD en Aiven (defaultdb por defecto)
        value: defaultdb
      - key: DB_USER        # p. ej. avnadmin
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Rol con DDL para las migraciones del arranque (§7.3). Se rellena solo
      # con self-reference a DB_USER/DB_PASSWORD: en Aiven el usuario por
      # defecto ya es administrador. Si luego se crean vet_app/vet_owner,
      # se sustituyen estos dos por los valores nuevos.
      - key: DB_OWNER_USER
        fromService:
          name: vet-manager-api
          type: web
          envVarKey: DB_USER
      - key: DB_OWNER_PASSWORD
        fromService:
          name: vet-manager-api
          type: web
          envVarKey: DB_PASSWORD

      # Render genera estos dos valores seguros automáticamente (no pegarlos).
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CREATE_KEY
        generateValue: true

      # Igual que VITE_API_URL: `fromService.host` se resolvió vacío al crear
      # el servicio y CORS_ORIGINS quedó sin orígenes permitidos (login 400
      # desde el navegador). Se fijan las URLs públicas reales.
      - key: CORS_ORIGINS
        value: https://vet-manager-web.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://vet-manager-web.onrender.com

      # Brevo (SMTP relay). EMAIL_USER = tu cuenta de Brevo, EMAIL_PASSWORD =
      # la clave SMTP generada en Brevo, EMAIL_FROM = remitente verificado.
      # Si se dejan vacíos, el registro activa la cuenta directamente.
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_FROM
        value: contacto@vetmanager.app
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false

  # ==================== FRONTEND (SPA React) ====================
  # OJO: el tipo válido es `web` con runtime `static`; `static_site` no existe
  # en la spec del Blueprint y `plan` no aplica a sitios estáticos.
  - type: web
    name: vet-manager-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@10.30.3 --activate && cd frontend && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: frontend/dist
    branch: main
    envVars:
      # Vite 8 exige Node >= 20.19; se fija para no depender del default de Render.
      - key: NODE_VERSION
        value: 22.13.0
      # Vite sustituye VITE_API_URL en el BUILD. `fromService` no se resolvió
      # al compilar y el bundle quedó apuntando a localhost:5000 (rott en el
      # navegador del usuario). Se fija la URL pública real del Web Service.
      - key: VITE_API_URL
        value: https://vet-manager-api.onrender.com
      - key: VITE_APP_NAME
        value: Vet Manager
    routes:
      # React Router necesita que las rutas profundas sirvan index.html.
      - type: rewrite
        source: /*
        destination: /index.html
